name: Android Release APK

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prod-release:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Secrets (Keystore & local.properties)
      run: |
        echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
        echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
        {
          echo "storeFile=bitchord-release.jks"
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
          echo "keyAlias=${{ secrets.KEY_ALIAS }}"
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
        } > keystore.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Signed Prod Release APK
      run: ./gradlew assembleProdRelease

    - name: Stage APKs with versioned per-ABI names
      run: |
        version="${GITHUB_REF_NAME#v}"
        mkdir -p dist
        for src in app/build/outputs/apk/prod/release/*.apk; do
          name=$(basename "$src")
          case "$name" in
            *universal*)      cp "$src" "dist/BitChord-v${version}.apk" ;;
            *arm64-v8a*)      cp "$src" "dist/BitChord-v${version}_arm64-v8a.apk" ;;
            *armeabi-v7a*)    cp "$src" "dist/BitChord-v${version}_armeabi-v7a.apk" ;;
            *x86_64*)         cp "$src" "dist/BitChord-v${version}_x86_64.apk" ;;
          esac
        done
        ls -lh dist

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: bitchord-prod-release-signed
        path: dist/*.apk

    - name: Attach APKs to the draft release
      if: github.ref_type == 'tag'
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.ref_name }}
        name: BitChord ${{ github.ref_name }}
        draft: true
        files: dist/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
