name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp into the packages, without the leading v"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  android:
    name: Android · signed APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        run: |
          version="${{ inputs.version }}"
          [ -n "$version" ] || version="${GITHUB_REF_NAME#v}"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "Building $version"

      - name: Setup secrets
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > bitchord-release.jks
          {
            echo "storeFile=bitchord-release.jks"
            echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}"
            echo "keyAlias=${{ secrets.KEY_ALIAS }}"
            echo "keyPassword=${{ secrets.KEY_PASSWORD }}"
          } > keystore.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testProdReleaseUnitTest

      - name: Build signed prod release APK
        run: ./gradlew assembleProdRelease -Pbitchord.version=${{ steps.version.outputs.value }}

      - name: Stage APKs with versioned per-ABI names
        run: |
          v=${{ steps.version.outputs.value }}
          mkdir -p dist
          for src in app/build/outputs/apk/prod/release/*.apk; do
            name=$(basename "$src")
            case "$name" in
              *universal*)   cp "$src" "dist/BitChord-v${v}.apk" ;;
              *arm64-v8a*)   cp "$src" "dist/BitChord-v${v}_arm64-v8a.apk" ;;
              *armeabi-v7a*) cp "$src" "dist/BitChord-v${v}_armeabi-v7a.apk" ;;
              *x86_64*)      cp "$src" "dist/BitChord-v${v}_x86_64.apk" ;;
            esac
          done
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: dist/*.apk

      - name: Draft the release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: BitChord ${{ github.ref_name }}
          draft: false
          files: dist/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
